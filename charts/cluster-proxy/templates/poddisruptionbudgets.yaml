{{- if gt (int .Values.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster-proxy-addon-manager
  namespace: {{ .Release.Namespace }}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      open-cluster-management.io/addon: cluster-proxy
      component: cluster-proxy-manager
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster-proxy-proxy-server
  namespace: {{ .Release.Namespace }}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      proxy.open-cluster-management.io/component-name: proxy-server
{{- if .Values.enableServiceProxy }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster-proxy-addon-user
  namespace: {{ .Release.Namespace }}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      open-cluster-management.io/addon: cluster-proxy
      component: cluster-proxy-addon-user
{{- end }}
{{- end }}
